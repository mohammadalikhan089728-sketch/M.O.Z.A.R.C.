<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOZARC AI — Next-Gen Intelligence</title>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #06080e;
            --surface-primary: rgba(15, 23, 42, 0.65);
            --surface-secondary: rgba(30, 41, 59, 0.55);
            --surface-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-active: rgba(99, 102, 241, 0.5);
            
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
            --accent-violet: #8b5cf6;
            --glow-indigo: rgba(99, 102, 241, 0.25);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-faint: #475569;
            
            --user-bubble: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --bot-bubble: rgba(18, 24, 38, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Ambient Glow Frame */
        .ambient-wrapper {
            position: relative;
            width: 100%;
            max-width: 960px;
            height: 94vh;
            padding: 1px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02) 60%, rgba(99, 102, 241, 0.3));
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px -10px var(--glow-indigo);
            display: flex;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 23px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Section */
        .chat-header {
            padding: 20px 28px;
            background: rgba(15, 23, 42, 0.45);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .brand-meta {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            position: relative;
        }

        .brand-avatar svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-creator {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-creator span {
            color: #38bdf8;
            font-weight: 600;
        }

        .system-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #34d399;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse-dot 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Message Board */
        .chat-messages {
            flex: 1;
            padding: 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .message-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .message-group.user {
            justify-content: flex-end;
        }

        .bubble {
            position: relative;
            max-width: 82%;
            padding: 14px 20px;
            font-size: 0.94rem;
            line-height: 1.65;
            letter-spacing: 0.01em;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: var(--user-bubble);
            color: #ffffff;
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 8px 24px -4px rgba(79, 70, 229, 0.35);
        }

        .bot .bubble {
            background: var(--bot-bubble);
            color: #e2e8f0;
            border-radius: 18px 18px 18px 4px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.45);
        }

        /* Input Controls */
        .chat-input-area {
            padding: 20px 28px;
            background: rgba(11, 15, 28, 0.7);
            border-top: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-bar {
            display: flex;
            align-items: flex-end;
            background: rgba(26, 35, 54, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 8px 12px 8px 18px;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-bar:focus-within {
            border-color: var(--accent-indigo);
            background: rgba(30, 41, 64, 0.85);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .input-bar textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: none;
            max-height: 140px;
            height: 24px;
            padding: 6px 0;
            box-sizing: content-box;
        }

        .input-bar textarea::placeholder {
            color: var(--text-faint);
        }

        .send-button {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .send-button:active:not(:disabled) {
            transform: scale(0.96);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .send-button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transform: translateX(1px);
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-faint);
            letter-spacing: 0.02em;
        }

        .footer-note strong {
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="ambient-wrapper">
        <div class="chat-container">
            <!-- Header -->
            <header class="chat-header">
                <div class="brand-meta">
                    <div class="brand-avatar">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zm0 8.8L4.6 7.4 12 4.1l7.4 3.3L12 10.8zm0 2.2l-10-5v6l10 5 10-5v-6l-10 5zm0 6l-10-5v2.8l10 5 10-5V16l-10 5z"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>MOZARC</h1>
                        <div class="brand-creator">Developed by <span>Mozahid</span></div>
                    </div>
                </div>

                <div class="system-pill">
                    <span class="status-dot"></span>
                    <span>Core Active</span>
                </div>
            </header>

            <!-- Chat Display -->
            <main class="chat-messages" id="chatBox">
                <div class="message-group bot">
                    <div class="bubble">Greetings! I am <strong>MOZARC</strong>, created by <strong>Mozahid</strong>. Ask me anything — long essays, full code files, or complex breakdowns. There are no token limits.</div>
                </div>
            </main>

            <!-- Controls -->
            <footer class="chat-input-area">
                <div class="input-bar">
                    <textarea 
                        id="userInput" 
                        placeholder="Message MOZARC... (Shift + Enter for multi-line)" 
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="sendBtn" onclick="sendMessage()" aria-label="Send">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <div class="footer-note">
                    Powered by <strong>MOZARC Architecture</strong> • Designed by <strong>Mozahid</strong>
                </div>
            </footer>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        // Dynamic Textarea Auto-expand
        userInput.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        });

        // Key Listeners
        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(text, sender) {
            const group = document.createElement("div");
            group.classList.add("message-group", sender);

            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            bubble.textContent = text;

            group.appendChild(bubble);
            chatBox.appendChild(group);
            chatBox.scrollTop = chatBox.scrollHeight;
            return bubble;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Render user query
            appendMessage(text, "user");
            userInput.value = "";
            userInput.style.height = '24px';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Live streaming bubble placeholder
            const botBubble = appendMessage("Thinking...", "bot");

            try {
                // Unlimited streaming setup with Puter
                const response = await puter.ai.chat(text, {
                    model: "openai/gpt-4o-mini",
                    stream: true,
                    max_tokens: 16000
                });

                botBubble.textContent = "";

                for await (const chunk of response) {
                    if (chunk?.text) {
                        botBubble.textContent += chunk.text;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            } catch (error) {
                botBubble.textContent = "Error: Connection lost or request failed. Please try again.";
                console.error("MOZARC Error:", error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
