<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited AI Chat</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 95vh;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .chat-header {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 14px;
            border-top: 1px solid #334155;
            background-color: #0f172a;
            gap: 10px;
        }

        .chat-input-area textarea {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #475569;
            border-radius: 10px;
            background-color: #1e293b;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            resize: none;
            height: 48px;
            line-height: 22px;
        }

        .chat-input-area textarea:focus {
            border-color: #38bdf8;
        }

        .chat-input-area button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #1d4ed8;
        }

        .chat-input-area button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            Long-Response AI Assistant
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message bot-message">Poocho, jitna lamba answer chahiye detailed me milega!</div>
        </div>

        <div class="chat-input-area">
            <textarea id="userInput" placeholder="Ask anything (Press Enter to send)..."></textarea>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        // Shift + Enter for new line, Enter to send
        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(text, sender) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender === "user" ? "user-message" : "bot-message");
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // User input show karo
            appendMessage(text, "user");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // AI bubble create karo
            const botBubble = appendMessage("Typing...", "bot");

            try {
                // Stream enable kiya hai taaki lamba answer bina crash/timeout huye live print ho sake
                const response = await puter.ai.chat(text, {
                    model: "openai/gpt-4o-mini",
                    stream: true,
                    max_tokens: 16000 // Maximum token limit set
                });

                botBubble.textContent = "";

                // Live chunks ko bubble me continuously append karo
                for await (const part of response) {
                    if (part?.text) {
                        botBubble.textContent += part.text;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            } catch (error) {
                botBubble.textContent = "Error: Text generation fail ho gaya. Dobara try karein.";
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
