<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat</title>

    <script src="https://js.puter.com/v2/"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1115;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* Main App */
        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #292d35;
            background: #15171c;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
        }

        .status {
            font-size: 12px;
            color: #7ee787;
            margin-left: 10px;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px 120px;
        }

        .chat {
            max-width: 850px;
            margin: auto;
        }

        .message {
            display: flex;
            margin-bottom: 22px;
            gap: 12px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 35px;
            height: 35px;
            min-width: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .ai .avatar {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
        }

        .user .avatar {
            background: #30343d;
            order: 2;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 15px;
            line-height: 1.55;
            font-size: 15px;
            word-wrap: break-word;
        }

        .ai .bubble {
            background: #1b1e24;
            border: 1px solid #292d35;
        }

        .user .bubble {
            background: #2563eb;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            border-bottom-left-radius: 4px;
        }

        /* Welcome */
        .welcome {
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .welcome-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #9ca3af;
            font-size: 15px;
        }

        /* Input Area */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                transparent,
                #0f1115 25%
            );
            padding: 30px 15px 18px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: #1b1e24;
            border: 1px solid #343943;
            border-radius: 18px;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.25);
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            padding: 11px;
            font-size: 15px;
            font-family: inherit;
            max-height: 130px;
            min-height: 44px;
        }

        textarea::placeholder {
            color: #777d88;
        }

        .send-btn {
            width: 43px;
            height: 43px;
            border: none;
            border-radius: 13px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 19px;
            transition: 0.2s;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .disclaimer {
            text-align: center;
            color: #666b75;
            font-size: 11px;
            margin-top: 8px;
        }

        /* Typing */
        .typing {
            display: flex;
            gap: 5px;
            padding: 5px 0;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .bubble {
                max-width: 82%;
                font-size: 14px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .chat-container {
                padding-top: 15px;
            }

            .header {
                height: 58px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">
        <div class="logo">AI</div>

        <div class="title">
            AI Assistant
        </div>

        <div class="status">
            ● Online
        </div>
    </div>


    <!-- Chat -->
    <div class="chat-container" id="chatContainer">

        <div class="chat" id="chat">

            <!-- Welcome Screen -->
            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    ✨
                </div>

                <h1>How can I help you?</h1>

                <p>
                    Ask me anything and I'll try to give you the best answer.
                </p>

            </div>

        </div>

    </div>


    <!-- Input -->
    <div class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="Message AI..."
                rows="1"
            ></textarea>

            <button
                class="send-btn"
                id="sendBtn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="disclaimer">
            AI can make mistakes. Check important information.
        </div>

    </div>

</div>


<script>

    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const chat = document.getElementById("chat");
    const chatContainer = document.getElementById("chatContainer");
    const welcome = document.getElementById("welcome");


    /* Enter = Send
       Shift + Enter = New Line
    */

    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            sendMessage();
        }

    });


    /* Auto resize textarea */

    input.addEventListener("input", function() {

        this.style.height = "auto";

        this.style.height =
            Math.min(this.scrollHeight, 130) + "px";

    });


    /* Add message */

    function addMessage(type, text) {

        const message = document.createElement("div");

        message.className = "message " + type;


        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.innerText =
            type === "user" ? "U" : "AI";


        const bubble = document.createElement("div");

        bubble.className = "bubble";

        /*
        Convert line breaks into HTML safely.
        */

        bubble.innerHTML =
            escapeHTML(text).replace(/\n/g, "<br>");


        message.appendChild(avatar);
        message.appendChild(bubble);

        chat.appendChild(message);

        scrollToBottom();

        return message;
    }


    /* Typing indicator */

    function addTyping() {

        const message = document.createElement("div");

        message.className = "message ai";

        message.id = "typingMessage";


        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.innerText = "AI";


        const bubble = document.createElement("div");

        bubble.className = "bubble";


        bubble.innerHTML = `
            <div class="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        `;


        message.appendChild(avatar);

        message.appendChild(bubble);

        chat.appendChild(message);

        scrollToBottom();
    }


    /* Send message */

    async function sendMessage() {

        const question =
            input.value.trim();


        if (!question) {
            return;
        }


        /* Remove welcome screen */

        if (welcome) {
            welcome.remove();
        }


        /* Add user message */

        addMessage("user", question);


        /* Clear input */

        input.value = "";

        input.style.height = "auto";


        /* Disable button */

        sendBtn.disabled = true;


        /* Show typing */

        addTyping();


        try {

            const response =
                await puter.ai.chat(question, {

                    model: "openai/gpt-6-astra"

                });


            /* Remove typing */

            const typing =
                document.getElementById("typingMessage");

            if (typing) {
                typing.remove();
            }


            /* Get AI response */

            let answer = "";


            if (response && response.message) {

                if (typeof response.message.content === "string") {

                    answer =
                        response.message.content;

                } else {

                    answer =
                        JSON.stringify(
                            response.message.content
                        );

                }

            } else {

                answer =
                    "Sorry, I couldn't understand the AI response.";

            }


            /* Add AI response */

            addMessage("ai", answer);


        } catch (error) {

            /* Remove typing */

            const typing =
                document.getElementById("typingMessage");

            if (typing) {
                typing.remove();
            }


            console.error(error);


            addMessage(
                "ai",
                "⚠️ Sorry, something went wrong. Please try again."
            );

        }


        /* Enable button */

        sendBtn.disabled = false;

        input.focus();

    }


    /* Scroll */

    function scrollToBottom() {

        setTimeout(() => {

            chatContainer.scrollTop =
                chatContainer.scrollHeight;

        }, 50);

    }


    /* Security */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
