<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #212529;
            border-bottom-left-radius: 4px;
        }

        .typing {
            font-style: italic;
            color: #6c757d;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #dee2e6;
            background-color: #fff;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input:focus {
            border-color: #007bff;
        }

        .chat-input-area button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #0056b3;
        }

        .chat-input-area button:disabled {
            background-color: #a0c4f2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            AI Assistant
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message bot-message">Hello! How can I help you today?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        // Allow sending message with the Enter key
        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        function appendMessage(text, sender, isTyping = false) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender === "user" ? "user-message" : "bot-message");
            if (isTyping) messageDiv.classList.add("typing");
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Display user message
            appendMessage(text, "user");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Show a temporary "Thinking..." message
            const loadingBubble = appendMessage("Thinking...", "bot", true);

            try {
                // Call Puter.js AI Chat
                const response = await puter.ai.chat(text, {
                    model: "openai/gpt-4o-mini" // You can change the model ID if desired
                });

                // Display the response from the AI
                loadingBubble.classList.remove("typing");
                loadingBubble.textContent = response?.message?.content || "No response received.";
            } catch (error) {
                loadingBubble.classList.remove("typing");
                loadingBubble.textContent = "Error: Unable to get a response. Please try again.";
                console.error("Puter AI Error:", error);
            } finally {
                // Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
